name: CI

on:
  pull_request:
  # Called by the deploy workflow so a push to main can't reach the server
  # without passing the same checks a pull request has to pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the base image in Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the runtime lock is in sync
        env:
          # Keeps the generated header identical however pip-compile is
          # invoked, so the diff below reacts only to real changes. Without
          # --upgrade pip-compile keeps the pins that are already in the lock,
          # so this fails when requirements.in was edited without regenerating,
          # not every time something new lands on PyPI.
          CUSTOM_COMPILE_COMMAND: pip-compile requirements.in
        run: |
          pip-compile --quiet --strip-extras requirements.in
          git diff --exit-code requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    # Only on pull requests: when this workflow is called by the deploy run,
    # that run builds and pushes the real image itself a moment later.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
