name: CI

on:
  pull_request:
  # Called by the deploy workflow so a push to main can't reach the server
  # without passing the same checks a pull request has to pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    # Pinned rather than ubuntu-latest, which GitHub moves to a new Ubuntu
    # release on its own schedule - the next move is to Ubuntu 26. Pinning
    # means the runner changes when this line changes, not on an announcement,
    # so a build that worked yesterday works today. Bump it deliberately.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the base image in Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The runner image has no ffmpeg, and the tests that run the real one -
      # the scale filter compress_video uses - would otherwise skip here. In
      # CI they fail rather than skip when it is missing, so this step
      # breaking cannot quietly switch them off.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Check the runtime lock is in sync
        env:
          # Keeps the generated header identical however pip-compile is
          # invoked, so the diff below reacts only to real changes. Without
          # --upgrade pip-compile keeps the pins that are already in the lock,
          # so this fails when requirements.in was edited without regenerating,
          # not every time something new lands on PyPI.
          CUSTOM_COMPILE_COMMAND: pip-compile requirements.in
        run: |
          pip-compile --quiet --strip-extras requirements.in
          git diff --exit-code requirements.txt

      - name: Check workflow inputs against the actions they call
        env:
          # Only lifts the API rate limit for reading each action manifest.
          # This is the automatic read-only token; the check needs nothing
          # else, which is what lets it run on a pull request from a fork.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_action_inputs.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    name: Build image
    runs-on: ubuntu-24.04
    # Only on pull requests: when this workflow is called by the deploy run,
    # that run builds and pushes the real image itself a moment later.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
