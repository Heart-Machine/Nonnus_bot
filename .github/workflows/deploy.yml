name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only the newest run waits for approval: merge three pull requests and one
# approval ships all three. A run parked on required reviewers counts as in
# progress rather than pending, so nothing short of cancel-in-progress
# displaces it.
#
# The group is on the whole run, not on the deploy job, so runs displace each
# other in the order of the pushes that started them. On the job it was the
# order in which their builds finished: two pull requests merged seconds apart
# built side by side, the newer one finished first and was waiting for
# approval when the older one's deploy came in and cancelled it - the server
# got the older commit.
#
# What a new push does to the run before it, as a throwaway workflow showed:
# a job that has not started yet is cancelled within a second of the push
# (tried on one waiting for a runner, and seen on a deploy parked on
# approval: a merge cancelled it the same second); a job already running is
# not cut off, but finishes, and the run is cancelled before its next job,
# the new run waiting meanwhile. So a push during a deploy lets it complete,
# then ships itself after approval.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # The same checks a pull request has to pass, so a push straight to main
  # cannot reach the server without them.
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    # Pinned rather than ubuntu-latest, which GitHub moves to a new Ubuntu
    # release on its own schedule - the next move is to Ubuntu 26. Pinning
    # means the runner changes when this line changes, not on an announcement,
    # so a build that worked yesterday works today. Bump it deliberately.
    runs-on: ubuntu-24.04
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}
      bot_api_image: ${{ steps.bot_api_image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Bot API server of the bot's own, when LOCAL_BOT_API is on: the
      # image bot-api-image.yml built for the commit the Dockerfile names,
      # pinned to its digest here - the tag moves whenever that image is
      # rebuilt, and a rerun of this deploy is to ship what it shipped. The
      # image is built by its own workflow, so a change of the server's commit
      # is to be merged and built before a deploy that uses it.
      - name: Pin the Bot API server image
        id: bot_api_image
        if: vars.LOCAL_BOT_API == 'true'
        run: |
          COMMIT="$(sed -n 's/^ARG TELEGRAM_BOT_API_COMMIT=//p' docker/telegram-bot-api/Dockerfile)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/telegram-bot-api:${COMMIT:0:12}"
          docker pull "$IMAGE"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-24.04
    needs: build
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only deploy/server.sh is wanted from it, and the token - it can
          # push packages - has no business staying in .git/config.
          persist-credentials: false

      # Plain OpenSSH, which the runner has, rather than an action. The one
      # used before, appleboy/ssh-action, took whatever key the server showed:
      # without its fingerprint input it ignores the host key, so whoever
      # answered at SSH_HOST would have been handed every secret below. It
      # also downloaded its ssh client as it ran, unchecked, so the pinned SHA
      # did not pin what got the private key; and it put the settings on the
      # command line on the server, in sight of its process list.
      - name: Deploy
        # appleboy/ssh-action's limits, kept: 30 seconds to connect (below)
        # and 10 minutes for the whole deploy.
        timeout-minutes: 10
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # The server's public host keys, as `cat /etc/ssh/ssh_host_*_key.pub`
          # prints them on the server itself: what ssh checks the server by.
          SSH_HOST_KEYS: ${{ secrets.SSH_HOST_KEYS }}
          IMAGE: ${{ needs.build.outputs.image }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STORAGE_CHAT_ID: ${{ secrets.STORAGE_CHAT_ID }}
          # These three go as they are, empty when not set: their defaults
          # depend on the Bot API server - 50 MB on the cloud one, 2000 MB on
          # the bot's own - and the bot works them out (nonnus/config.py).
          MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB }}
          PHOTO_MAX_FILE_SIZE_MB: ${{ vars.PHOTO_MAX_FILE_SIZE_MB || '10' }}
          PHOTO_MAX_DIMENSION: ${{ vars.PHOTO_MAX_DIMENSION || '2560' }}
          PHOTO_DOWNLOAD_TIMEOUT_SECONDS: ${{ vars.PHOTO_DOWNLOAD_TIMEOUT_SECONDS || '60' }}
          UPLOAD_TIMEOUT_SECONDS: ${{ vars.UPLOAD_TIMEOUT_SECONDS }}
          ENABLE_VIDEO_COMPRESSION: ${{ vars.ENABLE_VIDEO_COMPRESSION || 'true' }}
          VIDEO_COMPRESSION_TARGET_MB: ${{ vars.VIDEO_COMPRESSION_TARGET_MB }}
          VIDEO_COMPRESSION_HEIGHTS: ${{ vars.VIDEO_COMPRESSION_HEIGHTS || '1280,854,640' }}
          VIDEO_COMPRESSION_AUDIO_KBPS: ${{ vars.VIDEO_COMPRESSION_AUDIO_KBPS || '96' }}
          VIDEO_COMPRESSION_PRESET: ${{ vars.VIDEO_COMPRESSION_PRESET || 'veryfast' }}
          VIDEO_COMPRESSION_MIN_VIDEO_KBPS: ${{ vars.VIDEO_COMPRESSION_MIN_VIDEO_KBPS || '250' }}
          MAX_PARALLEL_DOWNLOADS: ${{ vars.MAX_PARALLEL_DOWNLOADS || '3' }}
          CANARY_POST_URL: ${{ vars.CANARY_POST_URL }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          DAILY_DOWNLOAD_LIMIT: ${{ vars.DAILY_DOWNLOAD_LIMIT || '5' }}
          DAILY_LIMIT_TIMEZONE: ${{ vars.DAILY_LIMIT_TIMEZONE || 'Europe/Moscow' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
          # A Bot API server of the bot's own instead of api.telegram.org -
          # see "Свой сервер Bot API" in the README.
          LOCAL_BOT_API: ${{ vars.LOCAL_BOT_API }}
          BOT_API_IMAGE: ${{ needs.build.outputs.bot_api_image }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # The run's own token rather than a stored one. It already has
          # package access through the packages: write permission above, and
          # it dies with the job - which is all the lifetime needed, since the
          # pull happens inside the job. Nothing long-lived to store, rotate,
          # or discover has silently expired.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without the keys strict checking refuses the server anyway; this
          # says why in words, before anything is sent.
          if [ -z "$SSH_HOST_KEYS" ]; then
            echo "SSH_HOST_KEYS is not set, so there is nothing to check the server by - see \"GitHub Actions Deploy\" in the README" >&2
            exit 1
          fi

          # The private key and known_hosts are for this step's eyes only.
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          # A secret pasted in a browser can come with CRLF line ends, and ssh
          # does not read a private key with them (known_hosts it does).
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          # Every key under one name, which ssh is told to look the server up
          # by (HostKeyAlias): a line then needs no host of its own - nor the
          # [host]:port form a port other than 22 would take.
          printf '%s\n' "$SSH_HOST_KEYS" | tr -d '\r' | sed '/^[[:space:]]*$/d; s/^/deploy-server /' > "$ssh_dir/known_hosts"

          # The settings for the server: every variable above but the SSH_
          # ones. They go first on ssh's standard input, as export lines - %q
          # quotes each value for the bash that reads them - and the script
          # follows (deploy/server.sh says why not the command line).
          names=(
            IMAGE BOT_TOKEN STORAGE_CHAT_ID
            MAX_FILE_SIZE_MB PHOTO_MAX_FILE_SIZE_MB PHOTO_MAX_DIMENSION PHOTO_DOWNLOAD_TIMEOUT_SECONDS UPLOAD_TIMEOUT_SECONDS
            ENABLE_VIDEO_COMPRESSION VIDEO_COMPRESSION_TARGET_MB VIDEO_COMPRESSION_HEIGHTS VIDEO_COMPRESSION_AUDIO_KBPS
            VIDEO_COMPRESSION_PRESET VIDEO_COMPRESSION_MIN_VIDEO_KBPS MAX_PARALLEL_DOWNLOADS CANARY_POST_URL
            ADMIN_USER_IDS DAILY_DOWNLOAD_LIMIT DAILY_LIMIT_TIMEZONE DEPLOY_PATH INSTAGRAM_COOKIES_B64
            LOCAL_BOT_API BOT_API_IMAGE TELEGRAM_API_ID TELEGRAM_API_HASH GHCR_USERNAME GHCR_TOKEN
          )
          {
            for name in "${names[@]}"; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat deploy/server.sh
          } | ssh -T -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlias=deploy-server \
            -o IdentitiesOnly=yes \
            -i "$ssh_dir/key" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" 'bash -s'
