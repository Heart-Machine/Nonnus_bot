name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The same checks a pull request has to pass, so a push straight to main
  # cannot reach the server without them.
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    # Pinned rather than ubuntu-latest, which GitHub moves to a new Ubuntu
    # release on its own schedule - the next move is to Ubuntu 26. Pinning
    # means the runner changes when this line changes, not on an announcement,
    # so a build that worked yesterday works today. Bump it deliberately.
    runs-on: ubuntu-24.04
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-24.04
    needs: build
    environment: production
    # Only the newest build waits for approval: merge three pull requests and
    # one approval ships all three. A deploy parked on required reviewers
    # counts as in progress rather than pending, so nothing short of
    # cancel-in-progress displaces it.
    #
    # The price: a newer run that finishes building while this one is
    # already deploying cancels it halfway too - GitHub cannot cancel only
    # the ones still waiting. That leaves no lasting damage, because the run
    # that did the cancelling then deploys everything from scratch once
    # approved; the script rewrites every file it touches. Until then the
    # bot may be down, if the cut came during `docker compose up`.
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STORAGE_CHAT_ID: ${{ secrets.STORAGE_CHAT_ID }}
          MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB || '50' }}
          PHOTO_MAX_FILE_SIZE_MB: ${{ vars.PHOTO_MAX_FILE_SIZE_MB || '10' }}
          PHOTO_MAX_DIMENSION: ${{ vars.PHOTO_MAX_DIMENSION || '2560' }}
          PHOTO_DOWNLOAD_TIMEOUT_SECONDS: ${{ vars.PHOTO_DOWNLOAD_TIMEOUT_SECONDS || '60' }}
          UPLOAD_TIMEOUT_SECONDS: ${{ vars.UPLOAD_TIMEOUT_SECONDS || '180' }}
          ENABLE_VIDEO_COMPRESSION: ${{ vars.ENABLE_VIDEO_COMPRESSION || 'true' }}
          VIDEO_COMPRESSION_TARGET_MB: ${{ vars.VIDEO_COMPRESSION_TARGET_MB || '49' }}
          VIDEO_COMPRESSION_HEIGHTS: ${{ vars.VIDEO_COMPRESSION_HEIGHTS || '1280,854,640' }}
          VIDEO_COMPRESSION_AUDIO_KBPS: ${{ vars.VIDEO_COMPRESSION_AUDIO_KBPS || '96' }}
          VIDEO_COMPRESSION_PRESET: ${{ vars.VIDEO_COMPRESSION_PRESET || 'veryfast' }}
          VIDEO_COMPRESSION_MIN_VIDEO_KBPS: ${{ vars.VIDEO_COMPRESSION_MIN_VIDEO_KBPS || '250' }}
          MAX_PARALLEL_DOWNLOADS: ${{ vars.MAX_PARALLEL_DOWNLOADS || '3' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
          # The run's own token rather than a stored one. It already has
          # package access through the packages: write permission above, and
          # it dies with the job - which is all the lifetime needed, since the
          # pull happens inside the job. Nothing long-lived to store, rotate,
          # or discover has silently expired.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE,BOT_TOKEN,STORAGE_CHAT_ID,MAX_FILE_SIZE_MB,PHOTO_MAX_FILE_SIZE_MB,PHOTO_MAX_DIMENSION,PHOTO_DOWNLOAD_TIMEOUT_SECONDS,UPLOAD_TIMEOUT_SECONDS,ENABLE_VIDEO_COMPRESSION,VIDEO_COMPRESSION_TARGET_MB,VIDEO_COMPRESSION_HEIGHTS,VIDEO_COMPRESSION_AUDIO_KBPS,VIDEO_COMPRESSION_PRESET,VIDEO_COMPRESSION_MIN_VIDEO_KBPS,MAX_PARALLEL_DOWNLOADS,DEPLOY_PATH,INSTAGRAM_COOKIES_B64,GHCR_USERNAME,GHCR_TOKEN
          script: |
            # appleboy/ssh-action dropped the script_stop input, and an input
            # it does not know is ignored rather than rejected - so the script
            # has to stop itself. Without this the action reports the exit code
            # of the last command, docker image prune, and a failed pull would
            # leave a green tick on a deploy that never happened.
            set -e

            APP_DIR="${DEPLOY_PATH:-$HOME/instagram-reels-bot}"
            mkdir -p "$APP_DIR/data" "$APP_DIR/cookies"
            cd "$APP_DIR"
            APP_UID="$(id -u)"
            APP_GID="$(id -g)"

            if [ -n "$GHCR_TOKEN" ]; then
              # Keep the registry credentials out of the user's permanent
              # docker config. Docker stores them base64-encoded rather than
              # encrypted and says so in a warning; here they live in a
              # directory this script creates and removes on the way out, so
              # nothing is left behind even when the deploy fails partway.
              DOCKER_CONFIG="$(mktemp -d)"
              export DOCKER_CONFIG
              trap 'rm -rf "$DOCKER_CONFIG"' EXIT

              # DOCKER_CONFIG also moves where docker looks for CLI plugins, so
              # a compose installed per-user rather than system-wide has to be
              # carried across or `docker compose` below stops resolving.
              if [ -d "$HOME/.docker/cli-plugins" ]; then
                ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
              fi

              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            COOKIES_FILE_VALUE=""
            if [ -n "$INSTAGRAM_COOKIES_B64" ]; then
              echo "$INSTAGRAM_COOKIES_B64" | base64 -d > cookies/instagram_cookies.txt
              # These are a live Instagram session - effectively a login
              # without a password - so they get the same treatment as .env
              # rather than being left readable by every user on the box. The
              # container runs as this same user, so it can still read them.
              chmod 600 cookies/instagram_cookies.txt
              COOKIES_FILE_VALUE="/app/cookies/instagram_cookies.txt"
            fi

            {
              printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
              printf 'COOKIES_FILE=%s\n' "$COOKIES_FILE_VALUE"
              printf 'MAX_FILE_SIZE_MB=%s\n' "$MAX_FILE_SIZE_MB"
              printf 'PHOTO_MAX_FILE_SIZE_MB=%s\n' "$PHOTO_MAX_FILE_SIZE_MB"
              printf 'PHOTO_MAX_DIMENSION=%s\n' "$PHOTO_MAX_DIMENSION"
              printf 'PHOTO_DOWNLOAD_TIMEOUT_SECONDS=%s\n' "$PHOTO_DOWNLOAD_TIMEOUT_SECONDS"
              printf 'UPLOAD_TIMEOUT_SECONDS=%s\n' "$UPLOAD_TIMEOUT_SECONDS"
              printf 'ENABLE_VIDEO_COMPRESSION=%s\n' "$ENABLE_VIDEO_COMPRESSION"
              printf 'VIDEO_COMPRESSION_TARGET_MB=%s\n' "$VIDEO_COMPRESSION_TARGET_MB"
              printf 'VIDEO_COMPRESSION_HEIGHTS=%s\n' "$VIDEO_COMPRESSION_HEIGHTS"
              printf 'VIDEO_COMPRESSION_AUDIO_KBPS=%s\n' "$VIDEO_COMPRESSION_AUDIO_KBPS"
              printf 'VIDEO_COMPRESSION_PRESET=%s\n' "$VIDEO_COMPRESSION_PRESET"
              printf 'VIDEO_COMPRESSION_MIN_VIDEO_KBPS=%s\n' "$VIDEO_COMPRESSION_MIN_VIDEO_KBPS"
              printf 'MAX_PARALLEL_DOWNLOADS=%s\n' "$MAX_PARALLEL_DOWNLOADS"
              printf 'STORAGE_CHAT_ID=%s\n' "$STORAGE_CHAT_ID"
              printf 'INLINE_CACHE_DB=%s\n' "/app/data/inline_cache.sqlite3"
              # The JSON cache from before INLINE_CACHE_DB: its posts are
              # carried into the database once, when the database is created.
              printf 'INLINE_CACHE_FILE=%s\n' "/app/data/inline_cache.json"
            } > .env
            chmod 600 .env

            {
              printf 'services:\n'
              printf '  instagram-reels-bot:\n'
              printf '    image: %s\n' "$IMAGE"
              printf '    container_name: instagram-reels-bot\n'
              printf '    restart: unless-stopped\n'
              printf '    user: "%s:%s"\n' "$APP_UID" "$APP_GID"
              printf '    env_file:\n'
              printf '      - .env\n'
              printf '    volumes:\n'
              printf '      - ./data:/app/data\n'
              printf '      - ./cookies:/app/cookies:ro\n'
            } > docker-compose.yml

            docker compose pull
            docker compose up -d
            docker image prune -f
